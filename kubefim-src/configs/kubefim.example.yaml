apiVersion: policy.kubefim.org/v1alpha1
kind: KubeFIMPolicy
spec:
  # observe evaluates exclusions without dropping events. Change this to
  # enforce only after reviewing would_suppress decisions in your environment.
  mode: observe

  defaults:
    access: aggregate
    mutation: audit

  protectedPaths:
    - /etc/**
    - /usr/bin/**
    - /usr/sbin/**

  rules:
    - id: execution-from-temporary-directory
      match:
        operations: [exec]
        pathPrefixes: [/tmp/**, /var/tmp/**, /dev/shm/**]
        success: true
      action: alert
      reason: Executable launched from a commonly writable temporary directory
      owner: security

    - id: failed-sensitive-access
      match:
        operations: [open]
        pathPrefixes: [/etc/shadow]
        success: false
      action: alert
      reason: Failed access to a sensitive credential file
      owner: security

  # v1alpha1 exclusions are deliberately limited to open events and require an
  # operation plus an absolute path scope. Alerts and protected paths always
  # reach output, including in enforce mode.
  exclusions:
    - id: application-runtime-library-reads
      match:
        operations: [open]
        pathPrefixes: [/usr/lib/**, /lib/**]
        namespaces: [example]
        containers: [application]
        success: true
      reason: Routine dynamic-library reads by the example application
      owner: platform-security

  # Exceptions only downgrade an alert to audit; they never discard events.
  # v1alpha1 requires operation + path + comm + UID, plus ownership and expiry.
  exceptions:
    - id: example-maintenance-window
      match:
        operations: [rename]
        pathPrefixes: [/opt/example/**]
        comms: [maintenance]
        uids: [0]
        success: true
      reason: Approved maintenance activity
      owner: platform-security
      expires: "2026-12-31T00:00:00Z"
