apiVersion: policy.kubefim.org/v1alpha1
kind: KubeFIMPolicy
spec:
  # v1alpha1 intentionally supports observe mode only. Policy decisions are
  # evaluated and explained, but all events still reach the normal output.
  mode: observe

  defaults:
    access: aggregate
    mutation: audit

  protectedPaths:
    - /etc/**
    - /usr/bin/**
    - /usr/sbin/**

  rules:
    - id: execution-from-temporary-directory
      match:
        operations: [exec]
        pathPrefixes: [/tmp/**, /var/tmp/**, /dev/shm/**]
        success: true
      action: alert
      reason: Executable launched from a commonly writable temporary directory
      owner: security

    - id: failed-sensitive-access
      match:
        operations: [open]
        pathPrefixes: [/etc/shadow]
        success: false
      action: alert
      reason: Failed access to a sensitive credential file
      owner: security

  # Exceptions only downgrade an alert to audit; they never discard events.
  # v1alpha1 requires operation + path + comm + UID, plus ownership and expiry.
  exceptions:
    - id: example-maintenance-window
      match:
        operations: [rename]
        pathPrefixes: [/opt/example/**]
        comms: [maintenance]
        uids: [0]
        success: true
      reason: Approved maintenance activity
      owner: platform-security
      expires: "2026-12-31T00:00:00Z"
