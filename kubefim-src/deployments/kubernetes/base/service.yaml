apiVersion: v1
kind: Service
metadata:
  name: kubefim-metrics
  namespace: kubefim-system
  labels:
    app.kubernetes.io/name: kubefim
    app.kubernetes.io/part-of: owasp-kubefim
spec:
  selector:
    app.kubernetes.io/name: kubefim
  ports:
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
